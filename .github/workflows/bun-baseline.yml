name: Bun 1.3.14 baseline

on:
  push:
    branches:
      - migration/node-pnpm
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-suite:
    name: Historical suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: dotagents
          persist-credentials: false

      - name: Check out exact event-sink source
        uses: actions/checkout@v4
        with:
          repository: fanilosendrison/event-sink
          ref: e75692f34ef212c9ad173a37a73539f35f54c6ff
          path: event-sink
          persist-credentials: false

      - name: Install exact Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify runtime and checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.14"
          test "$(git -C dotagents rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C event-sink rev-parse HEAD)" = "e75692f34ef212c9ad173a37a73539f35f54c6ff"

      - name: Build historical gateway
        shell: bash
        run: |
          set -euo pipefail
          dotagents="$GITHUB_WORKSPACE/dotagents"
          event_sink="$GITHUB_WORKSPACE/event-sink"
          baseline_home="$RUNNER_TEMP/dotagents-baseline-home"

          rm -rf "$baseline_home"
          mkdir -p "$baseline_home"
          ln -s "$dotagents" "$baseline_home/.agents"

          # Baseline-only alias preserves the historical telemetry import. The
          # portability phase replaces that import with the published package.
          sudo mkdir -p /Users/famillesendrison/Developper/Projects/telemetry-tools
          sudo ln -s "$event_sink" \
            /Users/famillesendrison/Developper/Projects/telemetry-tools/event-sink

          test "$(readlink "$baseline_home/.agents")" = "$dotagents"
          printf 'HOME=%s\n' "$baseline_home" >> "$GITHUB_ENV"

      - name: Run complete historical suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/.agents"
          bun run test

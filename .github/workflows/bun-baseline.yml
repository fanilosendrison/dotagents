name: Bun 1.3.14 baseline

on:
  push:
    branches:
      - migration/node-pnpm
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-suite:
    name: Historical suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install exact Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify runtime and checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.14"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Build historical gateway
        shell: bash
        run: |
          set -euo pipefail
          baseline_home="$RUNNER_TEMP/dotagents-baseline-home"
          rm -rf "$baseline_home"
          mkdir -p "$baseline_home"
          ln -s "$GITHUB_WORKSPACE" "$baseline_home/.agents"
          test "$(readlink "$baseline_home/.agents")" = "$GITHUB_WORKSPACE"
          printf 'HOME=%s\n' "$baseline_home" >> "$GITHUB_ENV"

      - name: Run complete historical suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/.agents"
          bun run test
